<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>阿Bu 悬浮球 · 设置</title>
    <style>
      body {
        font-family: "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
        max-width: 420px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #1f4554;
      }
      label {
        display: block;
        font-weight: 700;
        margin: 1rem 0 0.4rem;
      }
      input,
      select {
        width: 100%;
        padding: 0.65rem 0.75rem;
        border-radius: 10px;
        border: 1px solid #c5dde8;
        font-size: 0.95rem;
        box-sizing: border-box;
        background: #fff;
        color: #1f4554;
      }
      button {
        margin-top: 1rem;
        padding: 0.65rem 1.1rem;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, #1a6f88, #2f9eb8);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      .hint {
        color: #4a6878;
        font-size: 0.88rem;
        line-height: 1.5;
      }
      #status {
        margin-top: 0.75rem;
        font-size: 0.9rem;
        color: #1f738c;
      }
      code {
        font-size: 0.82rem;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>阿Bu 悬浮球</h1>
    <p class="hint">
      装好后请到扩展「详细信息」→ 网站访问权限 →「在所有网站上」，任意 http/https 页右下角才会出现悬浮球。
    </p>
    <label for="appUrl">阿Bu 网页地址</label>
    <input id="appUrl" placeholder="https://bubu-hkbu.streamlit.app" />
    <p class="hint">
      默认 <code>https://bubu-hkbu.streamlit.app</code>。若打开显示「没权限 / not found」，到
      share.streamlit.io → My apps 确认 Sharing=Public，并把卡片上的网址粘贴到这里。本机调试可用
      <code>http://localhost:8501</code>。
    </p>
    <label for="appLang">界面语言 / Language</label>
    <select id="appLang">
      <option value="zh-CN">简体中文</option>
      <option value="zh-TW">繁體中文</option>
      <option value="en">English</option>
    </select>
    <p class="hint">会影响悬浮球文案，并在跳转阿Bu 时带上 <code>lang=</code>。</p>
    <button id="save" type="button">保存</button>
    <div id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
