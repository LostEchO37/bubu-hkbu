<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>阿Bu</title>
    <style>
      body {
        margin: 0;
        padding: 12px 14px;
        width: 250px;
        font-family: "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
        color: #1f4554;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 15px;
      }
      p {
        margin: 0 0 8px;
        font-size: 12px;
        color: #4a6878;
        line-height: 1.45;
      }
      button {
        width: 100%;
        margin-top: 6px;
        padding: 0.55rem 0.75rem;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, #1a6f88, #2f9eb8);
        color: #fff;
        font-weight: 700;
        font-size: 12px;
        cursor: pointer;
      }
      a {
        color: #1f738c;
        font-size: 12px;
        font-weight: 700;
      }
      .warn {
        margin-top: 8px;
        padding: 8px 10px;
        border-radius: 10px;
        background: #e8f6fb;
        font-size: 11.5px;
        line-height: 1.45;
      }
      #status {
        margin-top: 8px;
        font-size: 11.5px;
        color: #1f738c;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <h1>阿Bu · 悬浮球</h1>
    <p>应出现在任意 http/https 网页右下角。点分支会打开阿Bu，并尽量带上已登录状态。</p>
    <button id="inject" type="button">在当前页强制显示悬浮球</button>
    <div id="status"></div>
    <div class="warn">
      1. 扩展「重新加载」后刷新目标网页<br />
      2. 详细信息 → 网站访问 →「在所有网站上」<br />
      3. 先在阿Bu 页登录一次（地址栏会带 auth），再点悬浮球任务才不用重登
    </div>
    <p style="margin-top: 10px"><a href="options.html" target="_blank">设置阿Bu 网页地址</a></p>
    <script src="popup.js"></script>
  </body>
</html>
